name: NavRule Heartbeat
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null "https://wxthggxymursffdytnfk.supabase.co/rest/v1/accesos?select=id&limit=1" -H "apikey: sb_publishable_o95RVLet5S0j2iJqVz03EA_T3UUvoH2"
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Registrar actividad una vez por mes
        run: |
          MES=$(date -u +%Y-%m)
          if [ "$(cat actividad.txt 2>/dev/null)" != "$MES" ]; then
            echo "$MES" > actividad.txt
            git config user.name "navrule-heartbeat"
            git config user.email "heartbeat@users.noreply.github.com"
            git add actividad.txt
            git commit -m "Actividad mensual $MES"
            git push
          fi
